<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — LearningGPT</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="theme-color" content="#7c5cff" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a1a; --bg-soft: #14142b; --surface: #1a1a3a;
  --line: rgba(255,255,255,0.08); --line-strong: rgba(255,255,255,0.14);
  --text: #f5f5fa; --text-dim: #a8a8c0; --text-mute: #6b6b85;
  --brand: #7c5cff; --brand-2: #5b8def; --accent: #44e0a4;
  --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, Segoe UI, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.55;
  -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh;
  display: flex; flex-direction: column;
}
a { color: inherit; text-decoration: none; }
.bg-orb { position: fixed; pointer-events: none; z-index: 0; border-radius: 50%; filter: blur(120px); opacity: 0.5; }
.bg-orb.one   { width: 500px; height: 500px; top: -120px; left: -120px; background: #7c5cff; }
.bg-orb.two   { width: 600px; height: 600px; bottom: -180px; right: -200px; background: #5b8def; opacity: 0.3; }
.bg-orb.three { width: 360px; height: 360px; top: 40%; left: 35%; background: #44e0a4; opacity: 0.14; }

nav.top {
  position: relative; z-index: 10;
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  background: rgba(10,10,26,0.85); border-bottom: 1px solid var(--line);
}
.nav-inner { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; max-width: 1180px; margin: 0 auto; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--text); }
.logo-mark {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg, #7c5cff 0%, #5b8def 50%, #44e0a4 100%);
  display: grid; place-items: center; font-weight: 800; font-size: 16px; color: white;
  box-shadow: 0 4px 16px rgba(124,92,255,0.5);
}
.nav-cta { display: flex; gap: 12px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  padding: 12px 22px; border-radius: 10px; font-size: 14px; font-weight: 600;
  border: 1px solid transparent; transition: transform .15s ease, box-shadow .15s ease, background .2s ease;
  white-space: nowrap; cursor: pointer; font-family: inherit;
}
.btn-primary { background: linear-gradient(135deg, #7c5cff 0%, #5b8def 100%); color: white; box-shadow: 0 6px 24px rgba(124,92,255,0.4); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(124,92,255,0.55); }
.btn-ghost { background: rgba(255,255,255,0.05); border-color: var(--line-strong); color: var(--text); }
.btn-ghost:hover { background: rgba(255,255,255,0.09); }

.wrap {
  position: relative; z-index: 1; flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 80px 24px; max-width: 680px; margin: 0 auto;
}
.code {
  font-size: clamp(96px, 22vw, 200px); font-weight: 800; line-height: 0.9;
  letter-spacing: -0.04em; margin: 0 0 8px;
  background: linear-gradient(135deg, #7c5cff 0%, #5b8def 50%, #44e0a4 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--brand-2); padding: 6px 12px; border: 1px solid rgba(91,141,239,0.3);
  border-radius: 999px; background: rgba(91,141,239,0.08); margin-bottom: 22px;
}
h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -0.02em; margin: 0 0 14px; }
h1 .serif { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; padding-right: 0.12em;
  background: linear-gradient(135deg, #7c5cff, #44e0a4); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.sub { font-size: 17px; color: var(--text-dim); margin: 0 0 32px; max-width: 460px; }
.cta { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.links { margin-top: 28px; font-size: 14px; color: var(--text-mute); }
.links a { color: var(--brand-2); font-weight: 600; }
.links a:hover { text-decoration: underline; }
.help { margin-top: 22px; font-size: 13px; color: var(--text-mute); }
.help a { color: var(--brand-2); font-weight: 600; }
</style>
</head>
<body>

<div class="bg-orb one"></div>
<div class="bg-orb two"></div>
<div class="bg-orb three"></div>

<nav class="top">
  <div class="nav-inner">
    <a href="/" class="logo"><div class="logo-mark">L</div>LearningGPT</a>
    <div class="nav-cta">
      <a href="/auth/login" class="btn btn-ghost">Sign in</a>
      <a href="/auth/signup" class="btn btn-primary">Start free</a>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="code">404</div>
  <span class="eyebrow">Page not found</span>
  <h1>This page took a <span class="serif">wrong turn.</span></h1>
  <p class="sub">The link's broken or the page moved. No worries — here's the way back.</p>
  <div class="cta">
    <a href="/" class="btn btn-primary">← Back to home</a>
    <a href="/lessons/" class="btn btn-ghost">Browse all lessons</a>
  </div>
  <div class="links">
    Popular: <a href="/lessons/foundations/">AI Foundations</a> · <a href="/playground">Playground</a> · <a href="/#pricing">Pricing</a>
  </div>
  <div class="help">
    Think something's broken? <a href="mailto:dan@learninggpt.ai?subject=Broken%20link%20on%20LearningGPT">Tell Dan →</a> — I read every email.
  </div>
</div>

<script>
// Show "Account" instead of "Sign in" when the visitor is logged in (matches the rest of the site)
(function(){
  try {
    if (!localStorage.getItem('lgpt_token')) return;
    document.querySelectorAll('a[href="/auth/login"], a[href="/auth/login/"], a[href="/login"]').forEach(function(a){
      a.textContent = 'Account';
      a.setAttribute('href', '/account');
    });
  } catch(e){}
})();
</script>
</body>
</html>
