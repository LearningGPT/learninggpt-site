<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — LearningGPT</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="theme-color" content="#7c5cff" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a1a; --line: rgba(255,255,255,0.08); --line-strong: rgba(255,255,255,0.14);
  --text: #f5f5fa; --text-dim: #a8a8c0; --text-mute: #6b6b85;
  --brand: #7c5cff; --brand-2: #5b8def; --accent: #44e0a4;
  --danger: #ff6b8a; --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--brand-2); text-decoration: none; }
a:hover { text-decoration: underline; }
.bg-orb { position: fixed; pointer-events: none; z-index: 0; border-radius: 50%; filter: blur(120px); opacity: 0.4; }
.bg-orb.one { width: 500px; height: 500px; top: -150px; left: -150px; background: #7c5cff; }
.bg-orb.two { width: 400px; height: 400px; bottom: -100px; right: -100px; background: #44e0a4; opacity: 0.2; }
nav { position: relative; z-index: 10; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; color: var(--text); }
.logo-mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #7c5cff, #5b8def, #44e0a4); display: grid; place-items: center; font-weight: 800; font-size: 15px; color: white; }
.auth-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; position: relative; z-index: 1; }
.auth-box { width: 100%; max-width: 420px; background: rgba(255,255,255,0.03); border: 1px solid var(--line-strong); border-radius: 20px; padding: 40px; }
.auth-box h1 { font-size: 26px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.02em; }
.auth-box .sub { font-size: 14px; color: var(--text-dim); margin: 0 0 32px; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 7px; }
.form-group input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--line-strong); color: var(--text); padding: 12px 14px; border-radius: 10px; font-size: 15px; font-family: inherit; }
.form-group input:focus { outline: none; border-color: var(--brand); }
.form-group input::placeholder { color: var(--text-mute); }
.input-wrap { position: relative; }
.form-group input.has-toggle { padding-right: 44px; }
.eye-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-mute); padding: 4px; display: flex; align-items: center; }
.eye-btn:hover { color: var(--text-dim); }
.btn-submit { width: 100%; background: linear-gradient(135deg, #7c5cff, #5b8def); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: opacity .15s; margin-top: 8px; }
.btn-submit:hover { opacity: 0.9; }
.btn-submit:disabled { opacity: 0.6; cursor: default; }
.auth-switch { text-align: center; font-size: 14px; color: var(--text-dim); margin-top: 20px; }
.forgot { text-align: right; font-size: 12px; margin-top: 6px; }
.error-msg { background: rgba(255,107,138,0.1); border: 1px solid rgba(255,107,138,0.3); border-radius: 8px; padding: 12px 14px; font-size: 13.5px; color: var(--danger); margin-bottom: 18px; display: none; }
.error-msg.visible { display: block; }
</style>
</head>
<body>
<div class="bg-orb one"></div>
<div class="bg-orb two"></div>
<nav>
  <a href="/" class="logo"><div class="logo-mark">L</div>LearningGPT</a>
  <a href="/auth/signup" style="font-size: 14px; color: var(--text-dim);">Create account →</a>
</nav>
<div class="auth-wrap">
  <div class="auth-box">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to continue learning.</p>
    <div class="error-msg" id="errorMsg"></div>
    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@company.com" autocomplete="email" />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="Your password" autocomplete="current-password" class="has-toggle" />
        <button class="eye-btn" id="eyeBtn" type="button" aria-label="Show password">
          <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="forgot"><a href="/auth/reset">Forgot password?</a></div>
    </div>
    <button class="btn-submit" id="submitBtn">Sign in</button>
    <div class="auth-switch">Don't have an account? <a href="/auth/signup">Create one free</a></div>
  </div>
</div>
<script>
  const submitBtn = document.getElementById('submitBtn');
  const errorMsg = document.getElementById('errorMsg');
  const eyeBtn = document.getElementById('eyeBtn');
  const passwordInput = document.getElementById('password');

  eyeBtn.addEventListener('click', function() {
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeBtn.setAttribute('aria-label', 'Hide password');
    } else {
      passwordInput.type = 'password';
      eyeBtn.setAttribute('aria-label', 'Show password');
    }
  });

  submitBtn.addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    errorMsg.classList.remove('visible');
    if (!email || !password) {
      errorMsg.textContent = 'Please enter your email and password.';
      errorMsg.classList.add('visible');
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';
    try {
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'login', email, password })
      });
      const data = await res.json();
      if (!res.ok || data.error) {
        errorMsg.textContent = data.error || 'Invalid email or password.';
        errorMsg.classList.add('visible');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
        return;
      }
      // Store session token
      localStorage.setItem('lgpt_token', data.token);
      localStorage.setItem('lgpt_plan', data.plan);
      // Redirect to lessons or original destination
      const redirect = new URLSearchParams(window.location.search).get('redirect') || '/lessons';
      window.location.href = redirect;
    } catch (err) {
      errorMsg.textContent = 'Something went wrong. Please try again.';
      errorMsg.classList.add('visible');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitBtn.click();
  });
</script>
</body>
</html>
