<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Welcome to LearningGPT!</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="theme-color" content="#7c5cff" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root { --bg: #0a0a1a; --text: #f5f5fa; --text-dim: #a8a8c0; --accent: #44e0a4; --brand: #7c5cff; --brand-2: #5b8def; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 24px; -webkit-font-smoothing: antialiased; }
.bg-orb { position: fixed; pointer-events: none; z-index: 0; border-radius: 50%; filter: blur(120px); opacity: 0.4; }
.bg-orb.one { width: 500px; height: 500px; top: -150px; left: -150px; background: #7c5cff; }
.bg-orb.two { width: 400px; height: 400px; bottom: -100px; right: -100px; background: #44e0a4; opacity: 0.25; }
.content { position: relative; z-index: 1; max-width: 480px; }
.check { width: 72px; height: 72px; background: linear-gradient(135deg, #44e0a4, #7c5cff); border-radius: 50%; display: grid; place-items: center; font-size: 32px; margin: 0 auto 28px; }
h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 12px; }
p { font-size: 16px; color: var(--text-dim); margin: 0 0 32px; line-height: 1.6; }
.btn { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #7c5cff, #5b8def); color: white; padding: 14px 28px; border-radius: 10px; font-size: 15px; font-weight: 600; text-decoration: none; }
.btn:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="bg-orb one"></div>
<div class="bg-orb two"></div>
<div class="content">
  <div class="check">🎉</div>
  <h1>You're in!</h1>
  <p>Your account is active and your subscription is confirmed. Time to start learning AI tools that actually change how you work.</p>
  <a href="/lessons" class="btn">Start learning →</a>
</div>
<script>
  // Clear any pending redirect and store confirmed pro status
  const params = new URLSearchParams(window.location.search);
  if (params.get('session_id')) {
    localStorage.setItem('lgpt_plan', 'pro');
  }
</script>
</body>
</html>
