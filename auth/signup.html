<style>
:root {

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

a { color: var(--brand-2); text-decoration: none; }

.bg-orb { position: fixed; pointer-events: none; z-index: 0; border-radius: 50%; filter: blur(120px); opacity: 0.4; }

.bg-orb.two { width: 400px; height: 400px; bottom: -100px; right: -100px; background: #44e0a4; opacity: 0.2; }

.logo-mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #7c5cff, #5b8def, #44e0a4); display: grid; place-items: center; font-weight: 800; font-size: 15px; color: white; }
.auth-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; position: relative; z-index: 1; }
.auth-box { width: 100%; max-width: 420px; background: rgba(255,255,255,0.03); border: 1px solid var(--line-strong); border-radius: 20px; padding: 40px; }
.auth-box h1 { font-size: 26px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.02em; }
.auth-box .sub { font-size: 14px; color: var(--text-dim); margin: 0 0 32px; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 7px; }
.form-group input, .form-group select { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--line-strong); color: var(--text); padding: 12px 14px; border-radius: 10px; font-size: 15px; font-family: inherit; }
.form-group select { cursor: pointer; }
.form-group select option { background: #1a1a2e; }
.form-group input:focus, .form-group select:focus { outline: none; border-color: var(--brand); }
.form-group input::placeholder { color: var(--text-mute); }
.btn-submit { width: 100%; background: linear-gradient(135deg, #7c5cff, #5b8def); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: opacity .15s; margin-top: 8px; }
.btn-submit:hover { opacity: 0.9; }
.btn-submit:disabled { opacity: 0.6; cursor: default; }
.auth-switch { text-align: center; font-size: 14px; color: var(--text-dim); margin-top: 20px; }
.error-msg { background: rgba(255,107,138,0.1); border: 1px solid rgba(255,107,138,0.3); border-radius: 8px; padding: 12px 14px; font-size: 13.5px; color: var(--danger); margin-bottom: 18px; display: none; }
.error-msg.visible { display: block; }
.plan-note { font-size: 12px; color: var(--text-mute); margin-top: 6px; }
</style>
</head>

  </div>
</div>
